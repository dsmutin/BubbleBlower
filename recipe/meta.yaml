{% set version = load_file_contents("VERSION").strip() %}

package:
  name: bubbleblower
  version: {{ version }}

source:
  path: ..

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - bubbleblower = bubbleblower.cli:main

requirements:
  host:
    - python 3.12
    - pip
    - setuptools
  run:
    - python 3.12

test:
  imports:
    - bubbleblower
  commands:
    - bubbleblower --version

about:
  home: https://github.com/dsmutin/BubbleBlower
  license: MIT
  license_file: LICENSE
  summary: "Iterative debubbling of totally coloured assembly graphs"

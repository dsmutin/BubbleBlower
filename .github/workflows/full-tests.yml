name: full tests

# Full pytest, then light examples that need no local reads or assemblers.
# examples/half stays off CI: it exits 2 when those inputs are missing.
# Not used on ordinary push/PR (those run required-tests.yml).

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: full-tests
  cancel-in-progress: false

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.12"
          auto-update-conda: true
          activate-environment: bubbleblower
          environment-file: environment.yml
      - name: All pytest (mandatory and optional)
        timeout-minutes: 30
        run: pytest --tb=short
      - name: Toy example
        timeout-minutes: 15
        run: python examples/toy/run.py
      - name: Light examples
        timeout-minutes: 30
        run: |
          set -euo pipefail
          python examples/error/run.py
          python examples/reads/run.py
          python examples/benchmark/run.py

name: bubbleblower
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12.14
  - setuptools=84.0.0
  - pytest=9.1.1
  - pytest-cov=7.1.0
  - numpy=2.5.3
  - pyyaml=6.0.3
  - matplotlib=3.10.8
  - pillow=11.3.0
  - pip
  - pip:
      # MetaMetro 0.21.0 (4ed0762). Editable: a wheel omits VERSION, so import fails.
      # https://github.com/dsmutin/metaMetro
      - "-e git+https://github.com/dsmutin/metaMetro.git@4ed07629b5659f8a832cc4dc102e4c96b3102bbb#egg=metametro"
variables:
  PYTHONPATH: src
